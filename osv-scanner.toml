# --- Group B: org.bouncycastle (3 IDs) — unlike Group A, these ARE on classpaths this repo
# actively executes: androidLintTool (lintDebug, required gate) for the 1.79 line, and Robolectric
# 4.16.1's {strictly 1.81}-pinned shadows-framework dependency (testDebugUnitTest, required gate)
# for the 1.81 line. Neither Lint's local-source analysis nor Robolectric's Android-framework
# shadows call the specific vulnerable BouncyCastle API named per-entry below with attacker-
# controlled input, but the code is genuinely loaded — shorter ignoreUntil than Group A.

[[IgnoredVulns]]
id = "GHSA-574f-3g2m-x479"
ignoreUntil = 2026-10-01
reason = "CRITICAL — bcprov-jdk18on's GOST28147 engine in CTR mode reuses keystream after 255 blocks, weakening confidentiality of GOST-encrypted data. Live on androidLintTool's 1.79 classpath and Robolectric's strictly-pinned 1.81 test classpath, but neither Lint's static analysis nor Robolectric's shadow framework invokes the GOST28147 engine. Short window given CRITICAL rating. Ref: backlog.md OSV-M803."

[[IgnoredVulns]]
id = "GHSA-c3fc-8qff-9hwx"
ignoreUntil = 2026-10-01
reason = "bcprov-jdk18on's LDAPStoreHelper (CertStore/CRLDistPoint LDAP-fetch helper) is vulnerable to LDAP injection, CWE-90, affects >=1.74 <1.84. Live on androidLintTool's 1.79 classpath and Robolectric's strictly-pinned 1.81 test classpath; neither path calls LDAPStoreHelper with attacker-controlled input. Ref: backlog.md OSV-M803."

[[IgnoredVulns]]
id = "GHSA-wg6q-6289-32hp"
