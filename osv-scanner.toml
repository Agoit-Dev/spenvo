# OSV-Scanner ignore list — see doc/designs/2026-09-02-osv-scanner-ci-design.md.
#
# NOT auto-discovered for lockfiles outside this directory: OSV-Scanner only auto-applies a config
# file placed in the SAME directory as the scanned lockfile, and does not propagate it to child
# directories (google.github.io/osv-scanner/configuration/). Every scan invocation in this repo's
# workflows passes --config=/repo/osv-scanner.toml explicitly (see Tasks 10-11) so this one file
# governs every lockfile regardless of which subdirectory it lives in.
#
# Every entry needs: the exact vulnerability ID, a reason with the risk assessment, a relatively
# short ignoreUntil, and a reference to the authorizing issue/decision when one exists. When
# ignoreUntil passes, OSV-Scanner treats the finding as active again automatically.
#
# OSV-M803 baseline triage (2026-09-02, backlog.md). 26 exceptions below cover the CRITICAL/HIGH/
# UNKNOWN findings from the real PR #33 osv-scanner-pr.yml run (463 blocking rows / 27 unique
# blocking vuln IDs) that trace to 9 transitive packages never present on any Android module's
# debugRuntimeClasspath/releaseRuntimeClasspath — verified via every module's gradle.lockfile
# configuration tags plus `./gradlew :app:dependencies`. A 27th (uuid, GHSA-w5hq-g745-h8pq, npm,
# rules-tests-only) is remediated directly via an npm override instead — see rules-tests/package.json.
#
# --- Group A: io.netty (23 IDs) — pulled only via AGP's unified-test-platform-* Android Test
# Platform tooling config, present on every Android module's lockfile because AGP wires that config
# into every module by default. No task that loads it (connectedAndroidTest, a Gradle Managed
# Device) is ever invoked in this repo: no match for connectedAndroidTest/connectedCheck/
# managedDevice in any build.gradle.kts or .github/workflows/*.yml. These Netty classes never load
# into any JVM this project runs. ignoreUntil set to the design doc's own ~3-month cadence.

